<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ Audio Daily Report</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --tag-bg: #1f2937;
      --tag-text: #58a6ff;
      --highlight: #f0883e;
      --green: #3fb950;
      --red: #f85149;
      --purple: #a371f7;
      --bg-dark: #0d1117;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

    /* Hero */
    .hero { 
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a2332 100%); 
      border-bottom: 1px solid var(--border); 
      padding: 48px 20px 40px; 
      text-align: center;
    }
    .hero .icon { font-size: 3.5rem; margin-bottom: 12px; display: block; }
    .hero h1 { font-size: 2rem; color: #e6edf3; margin-bottom: 6px; letter-spacing: -0.5px; }
    .hero .subtitle { color: var(--text-secondary); font-size: 0.95rem; }
    .hero .subtitle a { color: var(--accent); text-decoration: none; }

    /* Stats ribbon */
    .stats-ribbon { 
      display: flex; 
      gap: 12px; 
      max-width: 900px; 
      margin: -20px auto 0; 
      padding: 0 20px; 
      flex-wrap: wrap; 
      justify-content: center;
    }
    .stat-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 16px 24px; 
      text-align: center; 
      flex: 1; 
      min-width: 120px; 
      max-width: 200px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s, border-color 0.15s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .stat-card .num { font-size: 1.8rem; font-weight: 700; display: block; }
    .stat-card .num.papers { color: var(--accent); }
    .stat-card .num.news { color: var(--green); }
    .stat-card .num.days { color: var(--purple); }
    .stat-card .num.highlights { color: var(--highlight); }
    .stat-card .label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

    /* Main layout */
    .main-container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

    /* Filters */
    .filters { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 24px; 
      flex-wrap: wrap; 
      align-items: center;
    }
    .filters input, .filters select { 
      background: var(--bg-card); 
      color: var(--text); 
      border: 1px solid var(--border); 
      padding: 8px 14px; 
      border-radius: 8px; 
      font-size: 0.875rem; 
      outline: none;
      transition: border-color 0.15s;
    }
    .filters input:focus, .filters select:focus { border-color: var(--accent); }
    .filters input { flex: 1; min-width: 200px; }
    .filters input::placeholder { color: var(--text-secondary); }
    .filters .view-toggle { display: flex; gap: 4px; }
    .filters .view-btn { 
      padding: 8px 14px; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      background: var(--bg-card); 
      color: var(--text-secondary); 
      cursor: pointer; 
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .filters .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .filters .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* Day cards */
    .day-list { display: flex; flex-direction: column; gap: 12px; }
    .day-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 20px; 
      transition: border-color 0.15s, transform 0.1s;
      cursor: pointer;
    }
    .day-card:hover { border-color: var(--accent); transform: translateX(4px); }
    .day-card .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .day-card .day-date { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
    .day-card .day-date .edition { font-size: 0.78rem; color: var(--highlight); margin-left: 6px; }
    .day-card .day-stats { display: flex; gap: 12px; font-size: 0.8rem; color: var(--text-secondary); }
    .day-card .day-stats span { white-space: nowrap; }
    .day-card .day-highlights { margin-top: 8px; font-size: 0.85rem; }
    .day-card .highlight-item { display: flex; gap: 8px; margin-bottom: 4px; align-items: baseline; }
    .day-card .highlight-item .star { color: var(--highlight); flex-shrink: 0; }
    .day-card .highlight-item .title { color: var(--text); }
    .day-card .highlight-item .title a { color: inherit; text-decoration: none; }
    .day-card .highlight-item .title a:hover { text-decoration: underline; color: var(--accent); }
    .day-card .day-news { margin-top: 6px; font-size: 0.82rem; color: var(--text-secondary); }
    .day-card .day-news .news-tag { color: var(--green); margin-right: 4px; }
    .day-card .day-arrow { color: var(--text-secondary); font-size: 0.8rem; margin-top: 8px; }

    /* Calendar view */
    .calendar-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); 
      gap: 8px; 
    }
    .calendar-day { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      padding: 12px; 
      text-align: center;
      transition: border-color 0.15s, transform 0.1s;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
    }
    .calendar-day:hover { border-color: var(--accent); transform: translateY(-2px); }
    .calendar-day .month { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; }
    .calendar-day .day-num { font-size: 1.3rem; font-weight: 600; margin: 2px 0; }
    .calendar-day .weekday { font-size: 0.7rem; color: var(--text-secondary); }
    .calendar-day .day-count { font-size: 0.65rem; margin-top: 4px; color: var(--accent); }
    .calendar-day.today { border-color: var(--accent); box-shadow: 0 0 12px rgba(88, 166, 255, 0.15); }
    .calendar-day.has-pm { position: relative; }
    .calendar-day.has-pm::after {
      content: '×2';
      position: absolute; top: 4px; right: 6px;
      font-size: 0.55rem; color: var(--highlight);
      background: rgba(240, 136, 62, 0.15);
      padding: 1px 4px; border-radius: 4px;
    }

    /* Loading & Empty */
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    .loading .spinner { 
      display: inline-block; width: 32px; height: 32px; 
      border: 3px solid var(--border); border-top-color: var(--accent); 
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px; color: var(--text-secondary); }
    .empty .icon { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    /* Footer */
    footer { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 0.78rem; border-top: 1px solid var(--border); }
    footer a { color: var(--accent); text-decoration: none; }

    /* Responsive */
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .hero { padding: 32px 16px 28px; }
      .stat-card { min-width: 80px; padding: 12px 16px; }
      .stat-card .num { font-size: 1.3rem; }
      .calendar-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .filters input { min-width: 150px; }
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <div class="hero">
    <span class="icon">🎙️</span>
    <h1>Audio Daily Report</h1>
    <p class="subtitle">AI 自动抓取 · 每日推送 · 音频/AI 前沿论文与新闻</p>
    <p class="subtitle" style="margin-top:4px"><a href="https://github.com/natashastone-hub/audio-daily-report" target="_blank">🐙 GitHub 仓库</a></p>
  </div>

  <!-- Stats -->
  <div class="stats-ribbon">
    <div class="stat-card"><span class="num papers" id="statPapers">-</span><span class="label">📄 总论文数</span></div>
    <div class="stat-card"><span class="num news" id="statNews">-</span><span class="label">📰 总新闻数</span></div>
    <div class="stat-card"><span class="num highlights" id="statHighlights">-</span><span class="label">⭐ 重点推荐</span></div>
    <div class="stat-card"><span class="num days" id="statDays">-</span><span class="label">📅 覆盖天数</span></div>
  </div>

  <!-- Main -->
  <main class="main-container">
    <!-- Filters -->
    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍 搜索论文/新闻标题..." oninput="render()">
      <select id="monthFilter" onchange="render()">
        <option value="all">📅 全部月份</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" data-view="list" onclick="setView('list')">📋 列表</button>
        <button class="view-btn" data-view="calendar" onclick="setView('calendar')">📅 日历</button>
      </div>
    </div>

    <!-- Content -->
    <div id="content">
      <div class="loading"><div class="spinner"></div><p>正在加载日报数据...</p></div>
    </div>
  </main>

  <footer>
    <p>🤖 由 AI 自动生成 · <a href="https://github.com/natashastone-hub/audio-daily-report" target="_blank">GitHub</a> · Powered by OpenClaw</p>
  </footer>

  <script>
    // --- State ---
    let allDates = [];
    let dateData = {};    // date -> { papers: [...], news: [...] }
    let currentView = 'list';
    let totalPapers = 0, totalNews = 0, totalHighlights = 0;

    // --- Init ---
    async function init() {
      try {
        const resp = await fetch('dates.json');
        const rawDates = await resp.json();
        // deduplicate and sort desc
        allDates = [...new Set(rawDates)].sort((a,b) => b.localeCompare(a));
        document.getElementById('statDays').textContent = allDates.filter(d => !d.includes('-pm')).length;
      } catch(e) {
        document.getElementById('content').innerHTML = '<div class="empty"><span class="icon">⚠️</span>无法加载日期列表</div>';
        return;
      }
      
      // Build month filter
      const months = new Set(allDates.map(d => d.substring(0,7)));
      const sel = document.getElementById('monthFilter');
      [...months].sort().reverse().forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        sel.appendChild(opt);
      });

      // Load data in batches to avoid too many parallel fetches
      await loadAllData();
      render();
    }

    async function loadAllData() {
      const batchSize = 8;
      let loaded = 0;
      for (let i = 0; i < allDates.length; i += batchSize) {
        const batch = allDates.slice(i, i + batchSize);
        await Promise.all(batch.map(async d => {
          try {
            const resp = await fetch(`data/${d}.json`);
            if (resp.ok) {
              const json = await resp.json();
              dateData[d] = json;
            }
          } catch(e) {
            // ignore missing data
          }
        }));
        loaded += batch.length;
        // Update loading text
        const el = document.querySelector('.loading p');
        if (el) el.textContent = `正在加载日报数据... (${Math.min(loaded, allDates.length)}/${allDates.length})`;
      }
      // Compute totals
      for (const d of allDates) {
        const data = dateData[d];
        if (data) {
          totalPapers += (data.papers || []).length;
          totalNews += (data.news || []).length;
          totalHighlights += (data.papers || []).filter(p => p.highlight).length;
        }
      }
      document.getElementById('statPapers').textContent = totalPapers;
      document.getElementById('statNews').textContent = totalNews;
      document.getElementById('statHighlights').textContent = totalHighlights;
    }

    // --- Render ---
    function render() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase();
      const month = document.getElementById('monthFilter').value;
      
      let filtered = allDates.filter(d => {
        if (month !== 'all' && !d.startsWith(month)) return false;
        if (!search) return true;
        const data = dateData[d];
        if (!data) return false;
        const papers = data.papers || [];
        const news = data.news || [];
        return papers.some(p => (p.title||'').toLowerCase().includes(search) || (p.abstract||'').toLowerCase().includes(search))
            || news.some(n => (n.title||'').toLowerCase().includes(search) || (n.summary||'').toLowerCase().includes(search));
      });

      if (currentView === 'calendar') {
        renderCalendar(filtered);
      } else {
        renderList(filtered);
      }
    }

    function renderList(dates) {
      if (dates.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty"><span class="icon">🔍</span>没有找到匹配的日报</div>';
        return;
      }
      
      const today = new Date().toISOString().substring(0,10);
      let html = '<div class="day-list">';
      
      for (const d of dates) {
        const data = dateData[d];
        if (!data) continue;
        const papers = data.papers || [];
        const news = data.news || [];
        const highlights = papers.filter(p => p.highlight);
        const isPM = d.includes('-pm');
        const baseDate = d.replace('-pm','');
        const reportUrl = `reports/${d}.html`;
        const dispDate = isPM ? `${baseDate} <span class="edition">午间版</span>` : d;
        const isToday = baseDate === today;

        html += `<div class="day-card${isToday ? ' today' : ''}" onclick="window.location.href='${reportUrl}'">`;
        html += `<div class="day-header">`;
        html += `<span class="day-date">${dispDate}</span>`;
        html += `<span class="day-stats">`;
        html += `<span>📄 ${papers.length} 篇论文</span>`;
        html += `<span>📰 ${news.length} 条新闻</span>`;
        html += `</span></div>`;

        // Highlights preview
        if (highlights.length > 0) {
          html += '<div class="day-highlights">';
          for (const h of highlights.slice(0, 3)) {
            const shortTitle = h.title.length > 70 ? h.title.substring(0,67)+'...' : h.title;
            html += `<div class="highlight-item"><span class="star">⭐</span><span class="title">${escapeHtml(shortTitle)}</span></div>`;
          }
          if (highlights.length > 3) {
            html += `<div class="highlight-item"><span class="star"></span><span style="color:var(--text-secondary)">...还有 ${highlights.length-3} 篇重点推荐</span></div>`;
          }
          html += '</div>';
        }

        // News preview
        if (news.length > 0) {
          html += '<div class="day-news">';
          for (const n of news.slice(0, 2)) {
            const shortTitle = n.title.length > 60 ? n.title.substring(0,57)+'...' : n.title;
            html += `<div><span class="news-tag">📢</span>${escapeHtml(shortTitle)}</div>`;
          }
          if (news.length > 2) html += `<div style="color:var(--text-secondary);font-size:0.75rem">...还有 ${news.length-2} 条新闻</div>`;
          html += '</div>';
        }

        html += `<div class="day-arrow">查看完整日报 →</div>`;
        html += '</div>';
      }
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    function renderCalendar(dates) {
      if (dates.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty"><span class="icon">🔍</span>没有找到匹配的日报</div>';
        return;
      }

      const today = new Date().toISOString().substring(0,10);
      const weekdays = ['日','一','二','三','四','五','六'];
      
      let html = '<div class="calendar-grid">';
      for (const d of dates) {
        // skip pm entries in calendar view (show as badge on main day)
        if (d.includes('-pm')) continue;
        const data = dateData[d];
        const paperCount = data ? (data.papers||[]).length : 0;
        const hasPM = dateData[d+'-pm'] && (dateData[d+'-pm'].papers||[]).length > 0;
        const dt = new Date(d + 'T00:00:00+08:00');
        const month = dt.getMonth() + 1;
        const day = dt.getDate();
        const wd = weekdays[dt.getDay()];
        const dateUrl = `reports/${d}.html`;

        html += `<a href="${dateUrl}" class="calendar-day${d === today ? ' today' : ''}${hasPM ? ' has-pm' : ''}">`;
        html += `<div class="month">${month}月</div>`;
        html += `<div class="day-num">${day}</div>`;
        html += `<div class="weekday">周${wd}</div>`;
        html += `<div class="day-count">📄 ${paperCount} 篇</div>`;
        html += '</a>';
      }
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      render();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Start ---
    init();
  </script>
</body>
</html>
